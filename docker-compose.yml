# Arranque local: cp .env.example .env  (pon tu ANTHROPIC_API_KEY)  →  docker compose up --build
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ${ENV_FILE:-.env}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Define ANTHROPIC_API_KEY en .env}
      # Vacío = sin whitelist (en local el backend ve la IP del gateway Docker, no 127.0.0.1).
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      # La app usa el rol NO-dueño (RLS efectivo); Alembic migra como dueño.
      DATABASE_URL: postgresql+asyncpg://kisabella_app:${DB_PASSWORD:?Define DB_PASSWORD en .env}@db:5432/kisabella
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kisabella:${DB_PASSWORD}@db:5432/kisabella
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/db/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    environment:
      POSTGRES_DB: kisabella
      POSTGRES_USER: kisabella
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisabella -d kisabella"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
