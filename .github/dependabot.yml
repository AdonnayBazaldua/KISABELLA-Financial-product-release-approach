version: 2
# Las versiones mayores se actualizan a mano: rompen API (secure, eslint, tailwind) y el CI no
# construye las imagenes Docker, asi que un PR en verde no las valida.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    # Solo actualizaciones de seguridad. requirements.txt usa rangos sin lockfile, asi que
    # Dependabot no sabe la version instalada, se salta el filtro de versiones mayores y
    # propone combinaciones que pip no puede resolver (anthropic 2.x con langchain-anthropic 0.3).
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
