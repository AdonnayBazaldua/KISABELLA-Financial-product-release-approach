name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + RLS on real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and API tests (no network, fake LLM)
        working-directory: backend
        run: pytest -q --cov=agents --cov-fail-under=70  # ADR-0012
      - name: Row-Level Security against a disposable Postgres 16
        run: PYTHON=python scripts/test-rls.sh

  frontend:
    name: Frontend (tests, API types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # el backend se instala solo para regenerar los tipos desde su OpenAPI
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm test
      - name: Generated API types are in sync with the backend
        run: npm run check:types
      - run: npm run lint
      - run: npm run build
