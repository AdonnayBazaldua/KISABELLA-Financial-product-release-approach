[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:langgraph.*
    ignore::PendingDeprecationWarning:langchain.*
    ignore::PendingDeprecationWarning:langgraph.*
    ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning
markers =
    integration: requiere Postgres real (scripts/test-rls.sh)
